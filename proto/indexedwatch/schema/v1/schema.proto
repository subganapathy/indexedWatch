syntax = "proto3";

package indexedwatch.schema.v1;

import "google/protobuf/field_mask.proto";

// SchemaService manages schema versions for resource types.
// Schemas define the structure of resources including primary key,
// secondary indexes, and field definitions.
//
// Workflow:
// 1. RegisterSchemaVersion to create the first version of a new type
// 2. UpdateSchemaVersion to add subsequent versions (with compatibility checks)
// 3. SetCurrentSchemaVersion to activate a version for writes
// 4. Rollback by SetCurrentSchemaVersion to a previous version
//
// Validation: Use client-side linting for schema validation. Fetch existing
// schemas via ListSchemaVersions to check evolution compatibility locally.
service SchemaService {
  // RegisterSchemaVersion creates the first version of a new schema type.
  // Fails if the type already exists - use UpdateSchemaVersion for subsequent versions.
  // Does NOT automatically set as current - use SetCurrentSchemaVersion.
  // Provisions backend resources: WAL, State Machine, and LSMs for each secondary index.
  rpc RegisterSchemaVersion(RegisterSchemaVersionRequest) returns (RegisterSchemaVersionResponse);

  // UpdateSchemaVersion adds a new version to an existing schema type.
  // Fails if the type doesn't exist - use RegisterSchemaVersion for the first version.
  // Enforces schema evolution rules:
  // - Primary key cannot change
  // - Field types cannot change
  // - New required fields must have defaults
  // Does NOT automatically set as current - use SetCurrentSchemaVersion.
  rpc UpdateSchemaVersion(UpdateSchemaVersionRequest) returns (UpdateSchemaVersionResponse);

  // SetCurrentSchemaVersion sets which version is the current (active) version.
  // All new writes are validated against the current version.
  // Use this to activate a new version or rollback to a previous one.
  rpc SetCurrentSchemaVersion(SetCurrentSchemaVersionRequest) returns (SetCurrentSchemaVersionResponse);

  // GetSchemaVersion retrieves a specific schema version.
  // If version is empty, returns the current version.
  rpc GetSchemaVersion(GetSchemaVersionRequest) returns (GetSchemaVersionResponse);

  // ListSchemaTypes returns all schema types.
  // Returns the current version of each type by default.
  rpc ListSchemaTypes(ListSchemaTypesRequest) returns (ListSchemaTypesResponse);

  // ListSchemaVersions returns all versions of a schema type.
  rpc ListSchemaVersions(ListSchemaVersionsRequest) returns (ListSchemaVersionsResponse);
}

// RegisterSchemaVersionRequest creates the first version of a new schema type.
message RegisterSchemaVersionRequest {
  // The schema definition as a JSON string.
  // Using JSON allows schemas to be version-controlled and deployed via CI/CD.
  // Fails if the type already exists - use UpdateSchemaVersion for subsequent versions.
  //
  // Example:
  // {
  //   "type": "events",
  //   "version": "v1",
  //   "primaryKey": "id",
  //   "secondaryIndexes": ["user_id", "metadata.region"],
  //   "fields": {
  //     "id": {"type": "string", "required": true},
  //     "user_id": {"type": "string", "required": true},
  //     "metadata": {"type": "object"}
  //   }
  // }
  //
  // Secondary indexes support dot notation for nested fields (e.g., "metadata.region").
  // Type and version are parsed from the JSON - no separate fields needed.
  string schema_json = 1;
}

message RegisterSchemaVersionResponse {
  // The registered schema version with server-assigned metadata.
  SchemaVersion schema_version = 1;
}

// UpdateSchemaVersionRequest adds a new version to an existing type.
message UpdateSchemaVersionRequest {
  // The schema definition as a JSON string.
  // Type must already exist (use RegisterSchemaVersion for new types).
  // Version must be unique for this type.
  // Must pass schema evolution compatibility checks.
  // See RegisterSchemaVersionRequest for JSON format documentation.
  string schema_json = 1;
}

message UpdateSchemaVersionResponse {
  // The new schema version with server-assigned metadata.
  SchemaVersion schema_version = 1;

  // Compatibility check results (informational).
  // Lists what changed from the previous version.
  repeated string compatibility_notes = 2;
}

// SetCurrentSchemaVersionRequest sets the active version for a type.
message SetCurrentSchemaVersionRequest {
  // The schema type. Required.
  string type = 1;

  // The version to set as current. Required.
  // Must be a previously registered version.
  string version = 2;
}

message SetCurrentSchemaVersionResponse {
  // The schema version that is now current.
  SchemaVersion schema_version = 1;

  // The previous current version (for audit/logging).
  string previous_version = 2;
}

// GetSchemaVersionRequest retrieves a schema version.
message GetSchemaVersionRequest {
  // The schema type to retrieve. Required.
  string type = 1;

  // The version to retrieve. If empty, returns the current version.
  string version = 2;

  // Optional field mask to retrieve only specific fields.
  // If not set, all fields are returned.
  google.protobuf.FieldMask field_mask = 3;
}

message GetSchemaVersionResponse {
  SchemaVersion schema_version = 1;
}

// ListSchemaTypesRequest lists all schema types.
message ListSchemaTypesRequest {
  // Maximum number of types to return. Default is 100, max is 1000.
  int32 page_size = 1;

  // Token for pagination. Empty for first page.
  // Use next_page_token from previous response.
  string page_token = 2;
}

message ListSchemaTypesResponse {
  // The current version of each schema type.
  repeated SchemaVersion schema_versions = 1;

  // Token for next page. Empty if no more results.
  string next_page_token = 2;

  // Total count of schema types (across all pages).
  int32 total_count = 3;
}

// ListSchemaVersionsRequest lists all versions of a schema type.
message ListSchemaVersionsRequest {
  // The schema type. Required.
  string type = 1;

  // Maximum number of versions to return. Default is 100, max is 1000.
  int32 page_size = 2;

  // Token for pagination. Empty for first page.
  string page_token = 3;
}

message ListSchemaVersionsResponse {
  // All versions of the schema, ordered by registration time.
  repeated SchemaVersion schema_versions = 1;

  // The current (active) version.
  string current_version = 2;

  // Token for next page. Empty if no more results.
  string next_page_token = 3;

  // Total count of versions (across all pages).
  int32 total_count = 4;
}

// SchemaVersion defines a specific version of a schema type.
// This message is returned by the server; clients submit schema_json.
message SchemaVersion {
  // Unique identifier for this resource type. Immutable after creation.
  // Examples: "events", "users", "orders"
  string type = 1;

  // Version identifier. Must be unique within a type.
  // Convention: "v1", "v2", etc.
  string version = 2;

  // The field that serves as the primary key. Required.
  // Must reference a field defined in `fields`.
  // Cannot be changed after initial schema registration.
  string primary_key = 3;

  // Fields to create secondary indexes on.
  // Supports dot notation for nested fields (e.g., "metadata.region", "address.city").
  // Each must reference a field or nested path within `fields`.
  // Can be added in schema updates (new records only indexed).
  repeated string secondary_indexes = 4;

  // Field definitions for this schema.
  map<string, FieldDefinition> fields = 5;

  // Server-assigned metadata (read-only).
  SchemaVersionMetadata metadata = 6;
}

// FieldDefinition describes a single field in the schema.
message FieldDefinition {
  // The data type of this field.
  FieldType type = 1;

  // Whether this field is required on create.
  // If true and missing, write is rejected.
  bool required = 2;

  // Default value for this field (JSON-encoded).
  // Used when field is missing on read (for backwards compatibility).
  // Only applicable if required=false.
  string default_value = 3;

  // Human-readable description of this field.
  string description = 4;
}

// FieldType enumerates the supported field types.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;

  // String value (UTF-8).
  FIELD_TYPE_STRING = 1;

  // 64-bit signed integer.
  FIELD_TYPE_INT64 = 2;

  // 64-bit floating point.
  FIELD_TYPE_DOUBLE = 3;

  // Boolean value.
  FIELD_TYPE_BOOL = 4;

  // Raw bytes.
  FIELD_TYPE_BYTES = 5;

  // RFC 3339 timestamp string.
  FIELD_TYPE_TIMESTAMP = 6;

  // JSON object (nested structure).
  // Nested fields can be indexed using dot notation in secondary_indexes.
  FIELD_TYPE_OBJECT = 7;

  // JSON array (not indexed).
  FIELD_TYPE_ARRAY = 8;
}

// SchemaVersionMetadata contains server-assigned metadata.
message SchemaVersionMetadata {
  // When this schema version was registered.
  // RFC 3339 format.
  string created_at = 1;

  // Whether this is the current (active) version for its type.
  bool is_current = 2;

  // Sequence number in the schema WAL.
  // Used internally for ordering.
  uint64 wal_seq_num = 3;
}

// SchemaEvolutionError describes why a schema update was rejected.
message SchemaEvolutionError {
  // The type of evolution rule that was violated.
  EvolutionViolation violation = 1;

  // Human-readable description of the error.
  string message = 2;

  // The field that caused the violation, if applicable.
  string field = 3;
}

// EvolutionViolation enumerates schema evolution rule violations.
enum EvolutionViolation {
  EVOLUTION_VIOLATION_UNSPECIFIED = 0;

  // Attempted to change the primary key.
  EVOLUTION_VIOLATION_PRIMARY_KEY_CHANGED = 1;

  // Attempted to change a field's type.
  EVOLUTION_VIOLATION_FIELD_TYPE_CHANGED = 2;

  // Added a required field without a default value.
  EVOLUTION_VIOLATION_REQUIRED_FIELD_NO_DEFAULT = 3;

  // Attempted to rename a field (use add + deprecate instead).
  EVOLUTION_VIOLATION_FIELD_RENAMED = 4;
}
